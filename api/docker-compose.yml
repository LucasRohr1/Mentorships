services:
  db:
    image: postgres:16
    container_name: mentorships-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mentorships@1!
      POSTGRES_DB: mentorships
    ports:
      - "5432:5432"
    volumes:
      - mentorships_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentorships"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mentorships_pg_data:
